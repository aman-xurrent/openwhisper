name: OpenWhisper
options:
  bundleIdPrefix: com.amankumar
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OpenWhisper:
    type: application
    platform: macOS
    sources:
      - path: OpenWhisper
        excludes:
          - Info.plist
          - OpenWhisper.entitlements
    info:
      path: OpenWhisper/Info.plist
      properties:
        CFBundleDisplayName: OpenWhisper
        CFBundleName: OpenWhisper
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 Aman Kumar"
        NSMicrophoneUsageDescription: "OpenWhisper records your voice while the dictation hotkey is active and transcribes it on this Mac. Audio never leaves the device."
    entitlements:
      path: OpenWhisper/OpenWhisper.entitlements
      properties:
        com.apple.security.device.audio-input: true
    dependencies:
      - framework: Vendor/whisper.xcframework
        embed: true
        codeSign: true
      - framework: Vendor/llama.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amankumar.openwhisper
        PRODUCT_NAME: OpenWhisper
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_OBJC_BRIDGING_HEADER: OpenWhisper/Correction/LlamaShim/OpenWhisper-Bridging-Header.h
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES

  OpenWhisperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OpenWhisperTests
    dependencies:
      - target: OpenWhisper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amankumar.openwhisper.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenWhisper.app/Contents/MacOS/OpenWhisper"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  OpenWhisper:
    build:
      targets:
        OpenWhisper: all
        OpenWhisperTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpenWhisperTests
    archive:
      config: Release
